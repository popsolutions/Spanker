# SPDX-License-Identifier: CC-BY-SA-4.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-lint:
    name: Docs / SPDX sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPDX headers on docs
        run: |
          shopt -s globstar
          for f in **/*.md; do
            [ -f "$f" ] || continue
            grep -q "SPDX-License-Identifier" "$f" || { echo "$f missing SPDX header" ; exit 1; }
          done
